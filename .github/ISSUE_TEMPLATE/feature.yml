name: Feature request
description: Propose a focused improvement to QuestRelay
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain who is affected, what they cannot do and how often it matters
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than prescribing an implementation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
      description: Explain how people handle this today and why that is insufficient
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add safe examples, sketches or constraints that clarify the request
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same request
          required: true
        - label: This request describes one focused outcome
          required: true
