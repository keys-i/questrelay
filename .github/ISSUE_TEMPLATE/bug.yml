name: Bug report
description: Report a reproducible problem in QuestRelay
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve QuestRelay

        Remove secrets, access keys, personal information and private room details before submitting
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Describe the problem and what you were trying to do
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest reliable sequence that shows the problem
      placeholder: |
        1. Open
        2. Choose
        3. Observe
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Describe what should have happened
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the browser, operating system, Quest model or deployment type that matters
      placeholder: Safari 27 on macOS, Quest 3, Cloudflare deployment
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Add safe logs, screenshots or recordings after removing sensitive information
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem
          required: true
        - label: I removed secrets and personal information
          required: true
