name: Accessibility barrier
description: Report something that makes QuestRelay difficult or impossible to use
title: "[accessibility] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an accessibility barrier

        Read the [accessibility statement](https://github.com/keys-i/questrelay/blob/main/.github/ACCESSIBILITY.md) before submitting
  - type: textarea
    id: barrier
    attributes:
      label: Barrier
      description: Describe what prevented or made it harder for you to complete your task
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where it occurred
      description: Include the page, screen, control or task
      placeholder: Viewer room audio controls
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and assistive technology
      description: Include only details you are comfortable sharing, such as browser, operating system, input method or assistive technology
  - type: textarea
    id: expected
    attributes:
      label: What would help
      description: Describe the behaviour, alternative format or workaround you need
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain whether the barrier slows you down or blocks the task completely
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private room details and personal information I do not want public
          required: true
