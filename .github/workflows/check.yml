name: Check

on:
  push:
    branches: [main]
    paths-ignore: &community_files
      - '.github/ACCESSIBILITY.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore: *community_files
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx biome lint .
      - run: npm run build -w @questrelay/shared
      - run: npm run test -w @questrelay/shared
      - run: npm run test -w @questrelay/prototype
      - run: npm run test -w @questrelay/web
      - run: npm run build -w @questrelay/web

  deploy:
    runs-on: ubuntu-latest
    env:
      QUESTRELAY_ADMIN_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      QUESTRELAY_PUBLISH_KEY: pppppppppppppppppppppppppppppppp
      QUESTRELAY_VIEW_KEY: vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv
    steps:
      - uses: actions/checkout@v7
      - run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck tools/scripts/*.sh
          cp tools/config/.env.example .env
          docker compose -f tools/config/compose.yaml --project-directory . config --quiet

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: |
          if ! command -v clang >/dev/null || ! command -v cmake >/dev/null || ! command -v ninja >/dev/null || ! command -v pkg-config >/dev/null || ! command -v python3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y build-essential clang cmake ninja-build pkg-config python3 python3-pip python3-venv
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          cache-on-failure: true
      - run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo clippy --manifest-path backend/Cargo.toml --locked -- -D warnings

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/edge -> target
          cache-on-failure: true
      - run: cargo fmt --manifest-path backend/edge/Cargo.toml -- --check
      - run: cargo clippy --manifest-path backend/edge/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --manifest-path backend/edge/Cargo.toml --locked
      - id: worker-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ runner.arch }}
      - if: steps.worker-cache.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked
      - run: worker-build --release
        working-directory: backend/edge

  quest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v7
        with:
          go-version-file: quest/transport/go.mod
          cache-dependency-path: quest/transport/go.sum
      - uses: android-actions/setup-android@v4
      - id: android-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-37.2
            /usr/local/lib/android/sdk/build-tools/36.0.0
            /usr/local/lib/android/sdk/ndk/27.2.12479018
          key: android-37.2-36.0.0-27.2.12479018-${{ runner.os }}-${{ runner.arch }}
      - if: steps.android-cache.outputs.cache-hit != 'true'
        run: android sdk install 'platforms;android-37.2' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - run: go test ./...
        working-directory: quest/transport
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash tools/scripts/build-transport.sh
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
      - run: gradle -p quest/app :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: questrelay-quest-debug
          path: quest/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
